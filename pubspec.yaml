name: gantia_mobile
description: "Gantia Workshop — Mobile client"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  web_socket_channel: ^3.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.4
  flutter_riverpod: ^2.6.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.webp"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logos/logo.webp"
